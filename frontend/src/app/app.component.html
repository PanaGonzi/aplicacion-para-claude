<button
  type="button"
  class="menu-button"
  aria-controls="sidebar"
  [attr.aria-expanded]="menuOpen()"
  (click)="menuOpen.set(!menuOpen())"
>
  {{ menuOpen() ? 'Cerrar menú' : 'Menú' }}
</button>

<app-sidebar id="sidebar" [class.open]="menuOpen()" [backend]="backend()" />

<main>
  <router-outlet />
</main>
